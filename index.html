<!DOCTYPE html>
<html lang="bn" data-theme="fajr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NafsCare Pro</title>
    <meta name="theme-color" id="metaTheme" content="#eef4f0">
    <!-- প্রথম পেইন্টের আগেই থিম বসায়, তাই ঝলক (flash) লাগে না -->
    <script>try { var t = localStorage.getItem('nafscare_theme2'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { }</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css"> 
    <style>
        #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(140% 90% at 50% 15%, #163c33 0%, #0c241f 45%, #061612 100%); transition: opacity .5s ease; }
        #splash.hide { opacity: 0; pointer-events: none; }
        #splash .stars { position: absolute; inset: 0; opacity: 0; animation: spStarsIn 1.6s ease-out .1s forwards; }
        #splash .stars circle { fill: #fff; }
        @keyframes spStarsIn { to { opacity: .7; } }
        #splash .glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(233,162,27,.28) 0%, rgba(233,162,27,0) 70%); top: 8%; left: 50%; transform: translateX(-50%) scale(.6); opacity: 0; animation: spGlowIn 2.2s ease-out forwards; }
        @keyframes spGlowIn { 0% { opacity: 0; transform: translateX(-50%) scale(.6); } 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
        #splash .logo-ring { position: relative; width: 112px; height: 112px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, #22594c, #0e2a23); box-shadow: 0 0 0 1px rgba(233,162,27,.35), 0 18px 40px rgba(0,0,0,.5); opacity: 0; transform: scale(.55); animation: spLogoPop .75s cubic-bezier(.34,1.56,.64,1) .15s forwards; }
        #splash .logo-ring img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; }
        @keyframes spLogoPop { to { opacity: 1; transform: scale(1); } }
        #splash .appname { margin-top: 22px; font-family: 'Tiro Bangla', serif; font-size: 30px; color: #f6eccd; letter-spacing: .3px; opacity: 0; transform: translateY(10px); animation: spUpIn .6s ease-out .55s forwards; }
        #splash .tagline { margin-top: 8px; font-size: 13.5px; color: #cfd8c9; text-align: center; padding: 0 54px; line-height: 1.5; opacity: 0; transform: translateY(8px); animation: spUpIn .6s ease-out .78s forwards; }
        @keyframes spUpIn { to { opacity: 1; transform: translateY(0); } }
        #splash .brand { position: absolute; bottom: 50px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 9px; opacity: 0; animation: spFadeIn .7s ease-out 1.1s forwards; }
        #splash .brand .div { width: 30px; height: 1px; background: linear-gradient(90deg, transparent, rgba(233,162,27,.7), transparent); }
        #splash .brand .mark { font-family: 'Tiro Bangla', serif; font-size: 14px; letter-spacing: 3px; color: #e9c468; text-transform: uppercase; }
        @keyframes spFadeIn { to { opacity: 1; } }
    </style>
        <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div id="app">
        <main id="scroll" class="scroll">
            <section class="tab on" id="tab-home" aria-label="হোম"></section>
            <section class="tab" id="tab-track" aria-label="নামাজ ও আমল ট্র্যাকার"></section>
            <section class="tab" id="tab-report" aria-label="রিপোর্ট"></section>
            <section class="tab" id="tab-tasbeeh" aria-label="তাসবিহ"></section>
            <section class="tab" id="tab-quran" aria-label="কুরআন"></section>
            <section class="tab" id="tab-profile" aria-label="প্রোফাইল"></section>
            <noscript><p style="padding:24px">অ্যাপ চালাতে JavaScript চালু থাকতে হবে।</p></noscript>
        </main>

        <!-- কুরআনের প্লেয়ার: ট্যাব বদলালেও চলতে থাকে -->
        <div id="playerBar" class="pbar" hidden></div>

        <nav id="nav" class="nav" aria-label="প্রধান মেনু"></nav>

        <div id="toasts" class="toasts" aria-live="polite"></div>
        <div id="sheetRoot" class="sheet-root"></div>
        <div id="dlgRoot" class="dlg-root"></div>

        <audio id="qAudio" preload="none"></audio>
    </div>

    <script src="script.js"></script>
        <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js')); }</script>
</body>
</html>
